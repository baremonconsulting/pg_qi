name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PG19_SHA: 0b8bff042a997fe50fcd1c4c83b9ef1cc9ed8a89
  PG_DUCKDB_SHA: 8756099e267c47f0b86c24de4cf995327f1f4279
  DUCKDB_SHA: d54cbbe3df17e8e5ce68312f483b4155836112aa
  PG_DUCKDB_BUILD_MODE: source

jobs:
  compile:
    name: Compile PG${{ matrix.postgresql }} (-Werror)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgresql: ["16", "17", "18", "19"]
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL headers
        run: bash .github/scripts/ci-install-postgresql.sh "${{ matrix.postgresql }}"
      - name: Compile production and test variants
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "ci-artifacts/compile-pg${{ matrix.postgresql }}"
          pgconfig="/usr/lib/postgresql/${{ matrix.postgresql }}/bin/pg_config"
          make PG_CONFIG="$pgconfig" clean >"ci-artifacts/compile-pg${{ matrix.postgresql }}/production-clean.log" 2>&1
          make PG_CONFIG="$pgconfig" -j2 >"ci-artifacts/compile-pg${{ matrix.postgresql }}/production-build.log" 2>&1
          if strings pg_qi.so | grep -Eq 'pg_qi\.spike_|qi_spike_|qi_test_|PG_QI_FINAL'; then
            echo "test-only surface leaked into production library" >&2
            exit 1
          fi
          make PG_CONFIG="$pgconfig" clean >"ci-artifacts/compile-pg${{ matrix.postgresql }}/test-clean.log" 2>&1
          make PG_CONFIG="$pgconfig" PG_QI_TESTING=1 -j2 >"ci-artifacts/compile-pg${{ matrix.postgresql }}/test-build.log" 2>&1
          test -f pg_qi.so
      - name: Upload compile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-pg${{ matrix.postgresql }}
          path: ci-artifacts/compile-pg${{ matrix.postgresql }}

  regression:
    name: Regression PG${{ matrix.postgresql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgresql: ["16", "17", "18", "19"]
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL and dependencies
        run: bash .github/scripts/ci-install-postgresql.sh "${{ matrix.postgresql }}"
      - name: Build pinned pg_duckdb
        run: bash .github/scripts/ci-build-pg-duckdb.sh "${{ matrix.postgresql }}"
      - name: Build and install pg_qi
        run: bash .github/scripts/ci-build-install-pg-qi.sh "${{ matrix.postgresql }}" "ci-artifacts/regression-pg${{ matrix.postgresql }}"
      - name: Run pg_regress
        shell: bash
        run: |
          set -euo pipefail
          major="${{ matrix.postgresql }}"
          pgbin="/usr/lib/postgresql/$major/bin"
          pgdata="${RUNNER_TEMP}/regression-data-$major"
          pghost="${RUNNER_TEMP}/regression-socket-$major"
          pglog="${RUNNER_TEMP}/regression-pg$major.log"
          mkdir -p "$pghost"
          "$pgbin/initdb" -D "$pgdata" --no-locale --encoding=UTF8 --no-sync
          { echo "unix_socket_directories = '$pghost'"; echo "listen_addresses = ''"; echo "shared_preload_libraries = 'pg_duckdb,pg_qi'"; } >>"$pgdata/postgresql.conf"
          "$pgbin/pg_ctl" -D "$pgdata" -l "$pglog" -w start
          trap '"$pgbin/pg_ctl" -D "$pgdata" -m fast -w stop || true' EXIT
          PGHOST="$pghost" PGUSER="$USER" make PG_CONFIG="$pgbin/pg_config" PG_QI_TESTING=1 installcheck
          "$pgbin/pg_ctl" -D "$pgdata" -m fast -w stop
          trap - EXIT
      - name: Collect regression diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p "ci-artifacts/regression-pg${{ matrix.postgresql }}/diagnostics"
          cp regression.diffs regression.out "ci-artifacts/regression-pg${{ matrix.postgresql }}/diagnostics/" 2>/dev/null || true
          cp "${RUNNER_TEMP}/regression-pg${{ matrix.postgresql }}.log" "ci-artifacts/regression-pg${{ matrix.postgresql }}/diagnostics/postgresql.log" 2>/dev/null || true
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-pg${{ matrix.postgresql }}
          path: ci-artifacts/regression-pg${{ matrix.postgresql }}

  integration:
    name: S0-S11 integration PG${{ matrix.postgresql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgresql: ["16", "17", "18", "19"]
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL and dependencies
        run: bash .github/scripts/ci-install-postgresql.sh "${{ matrix.postgresql }}"
      - name: Build pinned pg_duckdb
        run: bash .github/scripts/ci-build-pg-duckdb.sh "${{ matrix.postgresql }}"
      - name: Build and install pg_qi
        run: bash .github/scripts/ci-build-install-pg-qi.sh "${{ matrix.postgresql }}" "ci-artifacts/integration-pg${{ matrix.postgresql }}"
      - name: Run S0-S11
        env:
          PG_INSTALL_ROOT: /usr/lib/postgresql
          WP9_MAJORS: ${{ matrix.postgresql }}
          WP9_SKIP_BUILD_INSTALL: "1"
          WP9_ARTIFACT_DIR: ${{ runner.temp }}/wp9-${{ matrix.postgresql }}
        run: bash scripts/spike1/wp9-matrix.sh
      - name: Upload S0-S11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-s0-s11-pg${{ matrix.postgresql }}
          path: |
            ${{ runner.temp }}/wp9-${{ matrix.postgresql }}/results.tsv
            ${{ runner.temp }}/wp9-${{ matrix.postgresql }}/pg*/*.log
            ci-artifacts/integration-pg${{ matrix.postgresql }}

  baseline-integration:
    name: Baseline S0-S11 PG${{ matrix.postgresql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgresql: ["16", "17", "18"]
    env:
      PG_DUCKDB_SHA: ee38d3b540ecea1d93683ba99bdcec5632a21eaf
      DUCKDB_SHA: 08e34c447bae34eaee3723cac61f2878b6bdf787
      DUCKDB_VERSION: v1.5.4
      DUCKDB_ARCHIVE_SHA256: 838d98a85e697bab9935010c88a8c67d3312ccedcab4cb4a0ba01da65113bb70
      PG_DUCKDB_BUILD_MODE: prebuilt
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL and dependencies
        run: bash .github/scripts/ci-install-postgresql.sh "${{ matrix.postgresql }}"
      - name: Build baseline pg_duckdb
        run: bash .github/scripts/ci-build-pg-duckdb.sh "${{ matrix.postgresql }}"
      - name: Build and install pg_qi
        run: bash .github/scripts/ci-build-install-pg-qi.sh "${{ matrix.postgresql }}" "ci-artifacts/baseline-pg${{ matrix.postgresql }}"
      - name: Run baseline S0-S11
        env:
          PG_INSTALL_ROOT: /usr/lib/postgresql
          WP9_MAJORS: ${{ matrix.postgresql }}
          WP9_SKIP_BUILD_INSTALL: "1"
          WP9_ARTIFACT_DIR: ${{ runner.temp }}/baseline-wp9-${{ matrix.postgresql }}
        run: bash scripts/spike1/wp9-matrix.sh
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-s0-s11-pg${{ matrix.postgresql }}
          path: |
            ${{ runner.temp }}/baseline-wp9-${{ matrix.postgresql }}/results.tsv
            ${{ runner.temp }}/baseline-wp9-${{ matrix.postgresql }}/pg*/*.log
            ci-artifacts/baseline-pg${{ matrix.postgresql }}

  differential:
    name: Differential semantics PG${{ matrix.postgresql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgresql: ["16", "19"]
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL and dependencies
        run: bash .github/scripts/ci-install-postgresql.sh "${{ matrix.postgresql }}"
      - name: Build target pg_duckdb
        run: bash .github/scripts/ci-build-pg-duckdb.sh "${{ matrix.postgresql }}"
      - name: Build and install pg_qi
        run: bash .github/scripts/ci-build-install-pg-qi.sh "${{ matrix.postgresql }}" "ci-artifacts/differential-pg${{ matrix.postgresql }}"
      - name: Run frozen corpus and known-issue exclusions
        shell: bash
        run: |
          set -euo pipefail
          major="${{ matrix.postgresql }}"
          pgbin="/usr/lib/postgresql/$major/bin"
          pgdata="${RUNNER_TEMP}/differential-data-$major"
          pghost="${RUNNER_TEMP}/differential-socket-$major"
          pglog="${RUNNER_TEMP}/differential-pg$major.log"
          artifacts="${RUNNER_TEMP}/differential-pg$major"
          mkdir -p "$pghost" "$artifacts"
          "$pgbin/initdb" -D "$pgdata" --no-locale --encoding=UTF8 --no-sync
          { echo "unix_socket_directories = '$pghost'"; echo "listen_addresses = ''"; echo "shared_preload_libraries = 'pg_duckdb,pg_qi'"; } >>"$pgdata/postgresql.conf"
          "$pgbin/pg_ctl" -D "$pgdata" -l "$pglog" -w start
          trap '"$pgbin/pg_ctl" -D "$pgdata" -m fast -w stop || true' EXIT
          "$pgbin/psql" -X -v ON_ERROR_STOP=1 -h "$pghost" -d postgres <<'SQL'
          CREATE EXTENSION pg_duckdb;
          CREATE EXTENSION pg_qi;
          CREATE EXTENSION pg_qi_spike_test;
          SQL
          PG_BIN="$pgbin" PGHOST="$pghost" WP14_ARTIFACT_DIR="$artifacts" bash scripts/wp14/run-differential.sh
          PG_BIN="$pgbin" PGHOST="$pghost" WP14_ARTIFACT_DIR="$artifacts" bash scripts/wp14/run-known-issues.sh
          cp "$pglog" "$artifacts/postgresql.log"
          "$pgbin/pg_ctl" -D "$pgdata" -m fast -w stop
          trap - EXIT
      - name: Upload differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-pg${{ matrix.postgresql }}
          path: |
            ${{ runner.temp }}/differential-pg${{ matrix.postgresql }}
            ci-artifacts/differential-pg${{ matrix.postgresql }}

  reentrancy-focus:
    name: Reentrancy and failpoints PG17
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL and dependencies
        run: bash .github/scripts/ci-install-postgresql.sh 17
      - name: Build pinned pg_duckdb
        run: bash .github/scripts/ci-build-pg-duckdb.sh 17
      - name: Build and install pg_qi
        run: bash .github/scripts/ci-build-install-pg-qi.sh 17 ci-artifacts/reentrancy-pg17
      - name: Repeat protected ERROR and reentrancy scenarios
        shell: bash
        run: |
          set -euo pipefail
          for repetition in 1 2 3; do
            PG_INSTALL_ROOT=/usr/lib/postgresql WP9_MAJORS=17 WP9_SKIP_BUILD_INSTALL=1 WP9_ARTIFACT_DIR="${RUNNER_TEMP}/reentrancy-$repetition" bash scripts/spike1/wp9-matrix.sh
          done
      - name: Upload reentrancy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reentrancy-focus-pg17
          path: |
            ${{ runner.temp }}/reentrancy-*/results.tsv
            ${{ runner.temp }}/reentrancy-*/pg17/*.log
            ci-artifacts/reentrancy-pg17

  concurrency-smoke:
    name: Concurrency smoke PG17 assertions
    runs-on: ubuntu-latest
    env:
      PG17_ASSERT_SHA: 083ac033419f690758508e08c1736089384bbee8
      PG_ASSERT_ROOT: /opt/postgresql/17-assert
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: bash .github/scripts/ci-install-postgresql.sh 17
      - name: Build PostgreSQL 17.11 with assertions
        run: bash .github/scripts/ci-build-postgresql-assert.sh
      - name: Build target pg_duckdb
        env:
          PG_CONFIG: /opt/postgresql/17-assert/bin/pg_config
        run: bash .github/scripts/ci-build-pg-duckdb.sh 17
      - name: Build and install pg_qi
        env:
          PG_CONFIG: /opt/postgresql/17-assert/bin/pg_config
        run: bash .github/scripts/ci-build-install-pg-qi.sh 17 ci-artifacts/concurrency-pg17
      - name: Run eight-client 300-second smoke
        env:
          PG_ASSERT_ROOT: /opt/postgresql/17-assert
          WP10_SKIP_BUILD_INSTALL: "1"
          WP10_DURATION: "300"
          WP10_CLIENTS: "8"
          WP10_ARTIFACT_DIR: ${{ runner.temp }}/wp10-pg17
        run: bash scripts/spike1/wp10-concurrency-smoke.sh
      - name: Upload concurrency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concurrency-smoke-pg17
          path: |
            ${{ runner.temp }}/wp10-pg17
            ci-artifacts/concurrency-pg17

  parallel-isolation:
    name: Parallel worker isolation S11 PG17
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL and dependencies
        run: bash .github/scripts/ci-install-postgresql.sh 17
      - name: Build pinned pg_duckdb
        run: bash .github/scripts/ci-build-pg-duckdb.sh 17
      - name: Build and install pg_qi
        run: bash .github/scripts/ci-build-install-pg-qi.sh 17 ci-artifacts/parallel-pg17
      - name: Run S11 with parallelism enabled
        env:
          PG_INSTALL_ROOT: /usr/lib/postgresql
          WP9_MAJORS: "17"
          WP9_SKIP_BUILD_INSTALL: "1"
          WP9_ARTIFACT_DIR: ${{ runner.temp }}/parallel-s11
        run: bash scripts/spike1/wp9-matrix.sh
      - name: Require explicit parallel-worker evidence
        run: grep -Eq '^[0-9]+\|t\|0\|f\|f\|' "${RUNNER_TEMP}/parallel-s11/pg17/S11.log"
      - name: Upload parallel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-isolation-pg17
          path: |
            ${{ runner.temp }}/parallel-s11/results.tsv
            ${{ runner.temp }}/parallel-s11/pg17/*.log
            ci-artifacts/parallel-pg17
