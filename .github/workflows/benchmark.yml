name: Manual benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PG19_SHA: 5c839a2a08b9b87a349be97371fac6c5a2873b10
  PG_DUCKDB_SHA: 8756099e267c47f0b86c24de4cf995327f1f4279
  DUCKDB_SHA: d54cbbe3df17e8e5ce68312f483b4155836112aa
  PG_DUCKDB_BUILD_MODE: source

jobs:
  benchmark:
    name: Benchmark PG${{ matrix.postgresql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgresql: ["16", "17", "18", "19"]
    steps:
      - uses: actions/checkout@v5
      - name: Install PostgreSQL and dependencies
        run: bash .github/scripts/ci-install-postgresql.sh "${{ matrix.postgresql }}"
      - name: Build target pg_duckdb
        run: bash .github/scripts/ci-build-pg-duckdb.sh "${{ matrix.postgresql }}"
      - name: Build and install pg_qi
        env:
          PG_QI_TESTING: "0"
        run: bash .github/scripts/ci-build-install-pg-qi.sh "${{ matrix.postgresql }}" "ci-artifacts/benchmark-pg${{ matrix.postgresql }}"
      - name: Run PGQI-4C production benchmark
        env:
          PG_INSTALL_ROOT: /usr/lib/postgresql
        run: |
          set -euo pipefail
          bash scripts/phase4c/run-benchmark.sh \
            "${{ matrix.postgresql }}" 25 250 \
            "${{ runner.temp }}/pgqi4c-benchmark-${{ matrix.postgresql }}" \
            | tee "ci-artifacts/benchmark-pg${{ matrix.postgresql }}/pgqi4c-path.txt"
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-pg${{ matrix.postgresql }}
          path: |
            ${{ runner.temp }}/pgqi4c-benchmark-${{ matrix.postgresql }}
            ci-artifacts/benchmark-pg${{ matrix.postgresql }}
